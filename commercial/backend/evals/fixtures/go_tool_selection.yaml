# GO tool selection. Same rule as tool_selection.yaml: grade the calls, not
# the prose. These rows are loaded and checked for shape. They are not run
# against a model from pytest.

- id: go-quick-catch-uses-guides
  prompt: How do I quick catch?
  game: go
  expect_tools: [search_go_guides]
  forbid_tools: [web_search, get_current_events]
  why: Quick catch is an evergreen mechanic. The guides corpus holds it.
    A web search is the fallback when that search misses.

- id: go-candy-xl-uses-guides
  prompt: How can I get more Candy XL?
  game: go
  expect_tools: [search_go_guides]
  forbid_tools: [web_search, get_raid_bosses]
  why: Candy XL sources do not change with today's raids. The guide is the
    first stop.

- id: go-community-day-mega-candy
  prompt: For the Pawniard Community Day, which Pokemon should I Mega Evolve to get the most candy?
  game: go
  expect_tools: [search_go_guides, web_search]
  forbid_tools: []
  why: This edition has no live event feed. The guide holds the shared-type
    bonus. Which species is featured is a web report, not a live listing.
    The question is not "today", because the Community Day is a dated event.

- id: go-egg-pool-has-no-live-feed
  prompt: What can I get from 7km eggs right now?
  game: go
  expect_tools: [web_search]
  forbid_tools: [search_go_guides]
  why: There is no egg feed. A web report is the lookup, and the answer
    must say it is not a live feed.

- id: go-research-has-no-live-feed
  prompt: What are the current field research rewards for a shiny?
  game: go
  expect_tools: [web_search]
  forbid_tools: [search_go_guides]
  why: There is no research feed. A web report is the lookup, and the
    answer must say it is not a live feed.

- id: go-rocket-lineup-has-no-live-feed
  prompt: How do I beat Giovanni right now?
  game: go
  expect_tools: [web_search]
  forbid_tools: [search_go_guides]
  why: There is no Rocket feed. A web report is the lookup, and the answer
    must say it is not a live feed. A guide call is not the lineup.

- id: go-medicham-great-league
  prompt: Is Medicham good in Great League?
  game: go
  expect_tools: [get_pvp_rankings]
  forbid_tools: [web_search, search_go_guides]
  why: Great League is an open overall ranking. The number is a PvPoke
    simulation. A guide does not hold today's rating.

- id: go-garchomp-master-moveset
  prompt: Best moveset for Garchomp in Master League?
  game: go
  expect_tools: [get_pvp_rankings]
  forbid_tools: [web_search]
  why: The recommended moveset is the ranking row. Master League is one of
    the four allowlisted leagues.

- id: go-ultra-top-5
  prompt: Top 5 Ultra League Pokemon right now?
  game: go
  expect_tools: [get_pvp_rankings]
  forbid_tools: [web_search, search_go_guides]
  why: A top list is the overall Ultra file with a limit. It is not a cup
    and not a web search.
