# GO tool selection. Same rule as tool_selection.yaml: grade the calls, not
# the prose. These rows are loaded and checked for shape. They are not run
# against a model from pytest.

- id: go-quick-catch-uses-guides
  prompt: How do I quick catch?
  game: go
  expect_tools: [search_go_guides]
  forbid_tools: [web_search, get_current_events]
  why: Quick catch is an evergreen mechanic. The guides corpus holds it.
    A web search is the fallback when that search misses.

- id: go-candy-xl-uses-guides
  prompt: How can I get more Candy XL?
  game: go
  expect_tools: [search_go_guides]
  forbid_tools: [web_search, get_raid_bosses]
  why: Candy XL sources do not change with today's raids. The guide is the
    first stop.

- id: go-community-day-mega-candy
  prompt: For the Pawniard Community Day, which Pokemon should I Mega Evolve to get the most candy?
  game: go
  expect_tools: [get_current_events, search_go_guides]
  forbid_tools: [web_search]
  why: The event listing says which species and bonuses are scheduled. The
    guide says the Mega bonus is a shared type, not a super-effective type.
    The question is not "today", because the Community Day is a dated event.
